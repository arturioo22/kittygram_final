version: '3.8'

services:
  db:
    image: postgres:13
    container_name: kittygram_db
    environment:
      POSTGRES_USER: kittygram_user
      POSTGRES_PASSWORD: strong_password
      POSTGRES_DB: kittygram
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - kittygram_network

  backend:
    image: arturioo22/kittygram_backend:latest
    container_name: kittygram_backend
    environment:
      - DJANGO_SETTINGS_MODULE=kittygram_backend.settings
    env_file: .env
    ports:
      - "9001:9000"
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/app/media
    depends_on:
      - db
    networks:
      - kittygram_network

  frontend:
    image: arturioo22/kittygram_frontend:latest
    container_name: kittygram_frontend
    volumes:
      - static_volume:/app/build
    command: sh -c "cp -r /app/build/* /app/build/ && npx -y http-server -p 8000 /app/build"
    networks:
      - kittygram_network

  gateway:
    image: arturioo22/kittygram_gateway:latest
    container_name: kittygram_gateway
    ports:
      - "9000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - backend
      - frontend
    networks:
      - kittygram_network

volumes:
  pg_data:
  static_volume:
  media_volume:

networks:
  kittygram_network:
    driver: bridge