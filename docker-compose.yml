volumes:
  pg_data_production:
  static_volume:
services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: arturioo22/kittygram_backend
    environment:
      - DJANGO_SETTINGS_MODULE=kittygram_backend.settings
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  frontend:
    image: arturioo22/kittygram_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/app/frontend/static

  gateway:
    image: arturioo22/kittygram_gateway
    env_file: .env
    ports:
      - 9000:80
    volumes:
      - static_volume:/static
      - media_volume:/media

  volumes:
    pg_data:
    static_volume:
    media_volume:

  networks:
    kittygram_network:
      driver: bridge