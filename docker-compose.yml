services:
  db:
    image: postgres:13
    container_name: kittygram_db
    restart: always
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - kittygram_network

  backend:
    image: arturioo22/kittygram_backend:latest
    environment:
      - DJANGO_SETTINGS_MODULE=kittygram_backend.settings
    container_name: kittygram_backend
    restart: always
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
    networks:
      - kittygram_network

  frontend:
    image: arturioo22/kittygram_frontend:latest  # ЗАМЕНИТЕ
    container_name: kittygram_frontend
    restart: always
    volumes:
      - static_volume:/app/frontend/static
    networks:
      - kittygram_network

  gateway:
    image: arturioo22/kittygram_gateway:latest  # ЗАМЕНИТЕ
    container_name: kittygram_gateway
    restart: always
    ports:
      - "9000:80"
    volumes:
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - backend
      - frontend
    networks:
      - kittygram_network

volumes:
  pg_data:
  static_volume:
  media_volume:

networks:
  kittygram_network:
    driver: bridge
