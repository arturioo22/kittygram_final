name: Kittygram CI/CD 
 
# Условие запуска 
on: 
  push: 
    branches: 
      - main # Запускается при пуше в ветку main 
 
# Запуск тестов 
jobs: 
  tests: 
    runs-on: ubuntu-latest 
    services: 
      postgres: 
        image: postgres:13.10 
        env: 
          POSTGRES_USER: kittygram_user 
          POSTGRES_PASSWORD: strong_password 
          POSTGRES_DB: kittygram 
        ports: 
          - 5432:5432 
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5 
     
    # Получение кода из репозитория 
    steps: 
    - uses: actions/checkout@v3 
    - name: Set up Python 
      uses: actions/setup-python@v4 
      with: 
        python-version: 3.12 
     
    # Установка зависимостей 
    - name: Install dependencies 
      run: | 
        python -m pip install --upgrade pip setuptools 
        pip install flake8==6.0.0 flake8-isort==6.0.0 
        pip install -r ./backend/requirements.txt 
 
    # Запуск проверки кода и тестов 
    - name: Test with flake8 and django tests 
      env: 
        SECRET_KEY: ${{ secrets.SECRET_KEY }} 
        POSTGRES_DB: kittygram 
        POSTGRES_USER: kittygram_user 
        POSTGRES_PASSWORD: strong_password 
        DB_HOST: 127.0.0.1 
        DB_PORT: 5432 
      run: | 
        cd backend 
        python -m flake8 . 
        python manage.py test 
 
  # Сборка и публикация backend 
  build_and_push_backend: 
    runs-on: ubuntu-latest 
    needs: tests 
    steps: 
      # Получение кода из репозитория 
      - name: Checkout code 
        uses: actions/checkout@v4 
       
      # Настройка Docker Buildx  
      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v3 
 
      # Авторизация в Docker Hub 
      - name: Login to DockerHub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }} 
 
      # Сборка и публикация образа 
      - name: Build and push backend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./backend 
          file: ./backend/Dockerfile 
          push: true 
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:latest 
 
  # Сборка и публикация frontend 
  build_and_push_frontend: 
    runs-on: ubuntu-latest 
    needs: tests 
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 
 
      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v3 
 
      - name: Login to DockerHub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }} 
 
      - name: Build and push frontend 
        uses: docker/build-push-action@v5 
        with: 
          context: ./frontend 
          file: ./frontend/Dockerfile 
          push: true 
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:latest 
 
  # Сборка и публикация gateway 
  build_and_push_gateway: 
    runs-on: ubuntu-latest 
    needs: tests 
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 
 
      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v3 
 
      - name: Login to DockerHub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }} 
 
      - name: Build and push gateway 
        uses: docker/build-push-action@v5 
        with: 
          context: ./nginx 
          file: ./nginx/Dockerfile 
          push: true 
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:latest 
 
  # Деплой на сервер 
  deploy: 
    runs-on: ubuntu-latest 
    needs:  
      - build_and_push_backend 
      - build_and_push_frontend 
      - build_and_push_gateway 
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 
 
      - name: Copy docker-compose.yml via ssh 
        uses: appleboy/scp-action@master 
        with: 
          host: ${{ secrets.SERVER_HOST }} 
          username: ${{ secrets.SERVER_USERNAME }} 
          key: ${{ secrets.SERVER_SSH_KEY }} 
          passphrase: ${{ secrets.SSH_PASSPHRASE }} 
          source: "docker-compose.yml,nginx/nginx.conf,.env" 
          target: "kittygram/" 
 
      - name: Deploy to server 
        uses: appleboy/ssh-action@master 
        with: 
          host: ${{ secrets.SERVER_HOST }} 
          username: ${{ secrets.SERVER_USERNAME }} 
          key: ${{ secrets.SERVER_SSH_KEY }} 
          passphrase: ${{ secrets.SSH_PASSPHRASE }} 
          script: | 
            cd ~/kittygram 
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin 
            sudo docker compose -f docker-compose.production.yml pull 
            sudo docker compose -f docker-compose.production.yml down 
            sudo docker compose -f docker-compose.production.yml up 
            sudo docker compose -f docker-compose.production.yml exec backend python manage.py migrate 
            sudo docker compose -f docker-compose.production.yml exec backend python manage.py collectstatic 
            sudo docker compose -f docker-compose.production.yml exec backend cp -r /app/collected_static/. /backend_static/static/ 
 
  # Отправка уведомления в Telegram 
  send_message: 
    runs-on: ubuntu-latest 
    needs: deploy 
    steps: 
      - name: Send message 
        uses: appleboy/telegram-action@master 
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Kittygram успешно обновлен!
            Репозиторий: ${{ github.repository }}
            Коммит: ${{ github.sha }}
            Ссылка: https://${{ secrets.KITTYGRAM_DOMAIN }}
