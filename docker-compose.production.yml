version: '3.8'

services:
  db:
    image: postgres:13
    container_name: kittygram_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file: .env
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    networks:
      - kittygram_network_prod
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME}/kittygram_backend:latest
    container_name: kittygram_backend_prod
    environment:
      - DJANGO_SETTINGS_MODULE=kittygram_backend.settings
    env_file: .env
    ports:
      - "9001:9000"
    volumes:
      - static_volume_prod:/app/collected_static
      - media_volume_prod:/app/media
    depends_on:
      - db
    networks:
      - kittygram_network_prod
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/kittygram_frontend:latest
    container_name: kittygram_frontend_prod
    volumes:
      - static_volume_prod:/app/build
    networks:
      - kittygram_network_prod
    restart: unless-stopped

  gateway:
    image: ${DOCKERHUB_USERNAME}/kittygram_gateway:latest
    container_name: kittygram_gateway_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume_prod:/static
      - media_volume_prod:/media
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kittygram_network_prod
    restart: unless-stopped

volumes:
  pg_data_prod:
  static_volume_prod:
  media_volume_prod:

networks:
  kittygram_network_prod:
    driver: bridge